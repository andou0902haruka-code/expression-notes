<header>
  <div class="header-row">
    <div>
      <h1>📝 表現メモ</h1>
      <p>思いついた日本語をその場で書いて、英訳フレーズを貯める</p>
    </div>
    <button class="refresh-btn" id="forceRefreshBtn">⟳ 更新</button>
  </div>
</header>

<main>

  <div class="capture-box">
    <textarea id="jaInput" placeholder="日本語で入力（単語でも文でもOK）" autocomplete="off"></textarea>
    <div class="capture-row">
      <button class="btn-save" id="saveBtn">＋ 保存する</button>
    </div>
  </div>

  <details class="howto">
    <summary>使い方</summary>
    <ol>
      <li>思いついた日本語を書いて「保存する」。その場で簡易英訳（機械翻訳）が表示される</li>
      <li>未清書メモが溜まったら「📋 コピー」でJSONをコピー</li>
      <li>Claude Codeに貼り付けて <code>/phrase-note-add</code> と伝える → 自然な英訳＋解説＋音声付きで「保存済みフレーズ」に清書される</li>
      <li>サイトが更新されたら、清書済みと同じ内容の未清書メモは自動で一覧から消える</li>
    </ol>
  </details>

  <input type="text" class="search-box" id="searchBox" placeholder="🔍 保存したフレーズを検索">

  <div class="section-title">
    <h2>🕓 未清書メモ（この端末のみ・<span id="pendingCount">0</span>件）</h2>
    <div class="section-actions">
      <button class="btn-mini" id="copyBtn">📋 コピー</button>
      <button class="btn-mini" id="clearBtn">🗑 全消去</button>
    </div>
  </div>
  <div id="pendingList"></div>

  <div class="section-title">
    <h2>📚 保存済みフレーズ（<span id="polishedCount">0</span>件）</h2>
    <div class="section-actions">
      <button class="btn-mini" id="hideModeBtn">🙈 英訳を隠す</button>
    </div>
  </div>
  <div id="polishedList"></div>

</main>

<div class="toast" id="toast"></div>

/* ---- 英訳を隠す自己テストモード ---- */
const HIDE_MODE_KEY = 'phraseNote_hideMode';
let hideMode = localStorage.getItem(HIDE_MODE_KEY) === '1';
let revealedIds = new Set();

function toggleHideMode() {
  hideMode = !hideMode;
  revealedIds.clear();
  localStorage.setItem(HIDE_MODE_KEY, hideMode ? '1' : '0');
  updateHideModeBtn();
  render();
}
function updateHideModeBtn() {
  document.getElementById('hideModeBtn').textContent = hideMode ? '👁 英訳を表示' : '🙈 英訳を隠す';
}
function revealPhrase(id) {
  revealedIds.add(id);
  render();
}

/* ---- 未清書メモ（localStorage） ---- */
const STORAGE_KEY = 'phraseNote_pending';

function getPending() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch (e) { return []; }
}
function setPending(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => t.classList.remove('show'), 2200);
}

async function translateRough(text) {
  try {
    const res = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=ja|en');
    const data = await res.json();
    return (data && data.responseData && data.responseData.translatedText) || null;
  } catch (e) {
    return null;
  }
}

async function saveEntry() {
  const input = document.getElementById('jaInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  const entry = { id: Date.now(), ja: text, en_rough: null, savedAt: new Date().toISOString() };
  const list = getPending();
  list.unshift(entry);
  setPending(list);
  render();

  const rough = await translateRough(text);
  const list2 = getPending();
  const idx = list2.findIndex(e => e.id === entry.id);
  if (idx !== -1) {
    list2[idx].en_rough = rough || '(簡易訳の取得に失敗。清書時にClaudeが英訳します)';
    setPending(list2);
    render();
  }
}

function deletePending(id) {
  setPending(getPending().filter(e => e.id !== id));
  render();
}

function clearAllPending() {
  if (!confirm('未清書メモを全て削除します。よろしいですか？')) return;
  setPending([]);
  render();
}

function copyPending() {
  const list = getPending();
  if (list.length === 0) { showToast('未清書メモがありません'); return; }
  const json = JSON.stringify(list, null, 2);
  const done = () => showToast('コピーしました。Claude Codeに貼り付けて /phrase-note-add と伝えてください');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(json).then(done).catch(() => fallbackCopy(json, done));
  } else {
    fallbackCopy(json, done);
  }
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); }
  catch (e) { showToast('コピーに失敗しました。手動で選択してください'); }
  document.body.removeChild(ta);
}

/* ---- 音声再生（edge-tts事前生成mp3） ---- */
let currentAudio = null;
let currentBtn = null;
function resetPlayBtn(btn) { btn.textContent = '🔊'; btn.classList.remove('playing'); }
function playAudio(btn, src) {
  const isSameBtn = (currentBtn === btn);
  if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
  if (currentBtn) { resetPlayBtn(currentBtn); currentBtn = null; }
  if (isSameBtn) { currentAudio = null; return; }
  const audio = new Audio(src);
  currentAudio = audio; currentBtn = btn;
  btn.textContent = '■'; btn.classList.add('playing');
  audio.onended = audio.onerror = () => { resetPlayBtn(btn); if (currentBtn === btn) { currentBtn = null; currentAudio = null; } };
  audio.play();
}

/* ---- 描画 ---- */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render() {
  const query = document.getElementById('searchBox').value.trim().toLowerCase();

  // 清書済みと一致する未清書メモは自動で除外（重複解消）
  const polishedJaSet = new Set(PHRASES.map(p => p.ja));
  let pending = getPending().filter(e => !polishedJaSet.has(e.ja));
  if (pending.length !== getPending().length) setPending(pending);

  const pendingFiltered = query
    ? pending.filter(e => (e.ja || '').toLowerCase().includes(query) || (e.en_rough || '').toLowerCase().includes(query))
    : pending;

  const polishedFiltered = (query
    ? PHRASES.filter(p => [p.ja, p.en, p.explanation].some(s => (s || '').toLowerCase().includes(query)))
    : PHRASES
  ).slice().reverse();

  document.getElementById('pendingCount').textContent = pending.length;
  document.getElementById('polishedCount').textContent = PHRASES.length;

  const pendingEl = document.getElementById('pendingList');
  pendingEl.innerHTML = pendingFiltered.length ? pendingFiltered.map(e => `
    <div class="card">
      <div class="card-head">
        <span class="badge badge-pending">🕓 未清書</span>
        <button class="del-btn" onclick="deletePending(${e.id})">✕ 削除</button>
      </div>
      <div class="ja">${escapeHtml(e.ja)}</div>
      <div class="en-rough">${e.en_rough ? escapeHtml(e.en_rough) : '翻訳中...'}</div>
    </div>
  `).join('') : `<div class="empty">未清書メモはありません</div>`;

  const polishedEl = document.getElementById('polishedList');
  polishedEl.innerHTML = polishedFiltered.length ? polishedFiltered.map(p => {
    const isRevealed = !hideMode || revealedIds.has(p.id);
    return `
    <div class="card">
      <div class="card-head">
        <span class="badge badge-done">📚 清書済み</span>
      </div>
      <div class="ja">${escapeHtml(p.ja)}</div>
      ${isRevealed ? `
      <div class="en">${escapeHtml(p.en)}</div>
      ${p.explanation ? `<div class="explanation">💡 ${escapeHtml(p.explanation)}</div>` : ''}
      ${p.related && p.related.length ? `<div class="related"><b>言い換え:</b> ${p.related.map(escapeHtml).join(' / ')}</div>` : ''}
      <div class="card-foot">
        <button class="icon-btn" onclick="playAudio(this, 'audio/${p.id}.mp3')">🔊</button>
        <span></span>
      </div>
      ` : `<button class="reveal-btn" onclick="revealPhrase(${p.id})">🙈 タップして英訳を表示</button>`}
    </div>
  `;
  }).join('') : `<div class="empty">保存済みフレーズはまだありません</div>`;
}

document.getElementById('saveBtn').addEventListener('click', saveEntry);
document.getElementById('jaInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) saveEntry();
});
document.getElementById('copyBtn').addEventListener('click', copyPending);
document.getElementById('clearBtn').addEventListener('click', clearAllPending);
document.getElementById('searchBox').addEventListener('input', render);
document.getElementById('forceRefreshBtn').addEventListener('click', () => {
  location.href = location.pathname + '?_=' + Date.now();
});
document.getElementById('hideModeBtn').addEventListener('click', toggleHideMode);

updateHideModeBtn();
render();
</script>
